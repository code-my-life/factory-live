name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifications (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 24 : l'image Docker. 26 : le Node des agents de la factory (outils d'Hermès).
        node: ['24.22.1', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:text
      - run: npm run check:arch
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Image Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile -t factory-live:ci .
      - name: Le conteneur démarre et répond, utilisateur 1000, racine en lecture seule
        run: |
          docker run -d --name fl --read-only --tmpfs /tmp -v fl-data:/data --user 1000:1000 -p 127.0.0.1:8446:8446 factory-live:ci
          ok=0; for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8446/healthz && { ok=1; break; }; sleep 1; done
          if [ "$ok" != 1 ]; then docker logs fl; exit 1; fi
          curl -fsS http://127.0.0.1:8446/api/openapi.json > /dev/null
          test "$(docker inspect -f '{{.Config.User}}' fl)" = "1000:1000"
          docker logs fl | tail -5
