name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifications (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 24 : l'image Docker. 26 : le Node des agents de la factory (outils d'Hermès).
        node: ['24.22.1', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm run check:text
      - run: npm run check:arch
      # The JUnit report feeds the recette of the PR (#22): published at every run, green included.
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=reports/junit/vitest.xml
      - name: Rapport JUnit des tests unitaires (recette des PR)
        if: always() && matrix.node == '24.22.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-unit
          path: reports/junit/
          if-no-files-found: ignore
          retention-days: 30
          # A rerun of the job replaces its report instead of failing on the name.
          overwrite: true
      - run: npm run build

  docker:
    name: Image Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile -t factory-live:ci .
      - name: Le conteneur démarre sur un socle et répond, utilisateur 1000, racine en lecture seule, healthcheck sain
        run: |
          # factory-live reads the factory from workflow-core alone (#72): the e2e's fake core, run with the image's
          # own Node and dependencies, on a network of their own; its test secret in the secrets' folder.
          docker network create fl-net
          docker run -d --name core --network fl-net -e HOST=0.0.0.0 -e PORT=4182 \
            -v "$PWD/e2e:/app/e2e:ro" -v "$PWD/fixtures:/app/fixtures:ro" \
            -v "$PWD/packages/contracts/src:/app/packages/contracts/src:ro" \
            -v "$PWD/apps/web/src/demo/sheets:/app/apps/web/src/demo/sheets:ro" \
            --entrypoint node factory-live:ci e2e/fake-api.mjs
          mkdir -p "$RUNNER_TEMP/secrets"
          printf 'secret-du-socle-des-e2e' > "$RUNNER_TEMP/secrets/workflow-core-secret"
          chmod -R a+rX "$RUNNER_TEMP/secrets"
          docker run -d --name fl --network fl-net --read-only --tmpfs /tmp -v fl-data:/data --user 1000:1000 --health-interval 2s --health-start-period 1s -v "$RUNNER_TEMP/secrets:/run/secrets/factory-live:ro" -e WORKFLOW_CORE_URL=http://core:4182 -e GITHUB_API=http://core:4182/github -p 127.0.0.1:8446:8446 factory-live:ci
          ok=0; for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8446/healthz && { ok=1; break; }; sleep 1; done
          if [ "$ok" != 1 ]; then docker logs core; docker logs fl; exit 1; fi
          # The code line's sheet comes from the core: none is embedded in the image.
          read=0; for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8446/api/workflows | grep -q '"source":"published"' && { read=1; break; }; sleep 1; done
          if [ "$read" != 1 ]; then docker logs core; docker logs fl; exit 1; fi
          curl -fsS http://127.0.0.1:8446/api/openapi.json > /dev/null
          # Contrôle de l'hôte (DNS rebinding) : un nom inconnu reçoit 421, le healthcheck de l'image reste sain.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:8446' http://127.0.0.1:8446/healthz)" = 421
          healthy=0; for i in $(seq 1 20); do [ "$(docker inspect -f '{{.State.Health.Status}}' fl)" = healthy ] && { healthy=1; break; }; sleep 1; done
          if [ "$healthy" != 1 ]; then docker inspect -f '{{json .State.Health}}' fl; exit 1; fi
          test "$(docker inspect -f '{{.Config.User}}' fl)" = "1000:1000"
          docker logs fl | tail -5

  e2e:
    name: Bout en bout (Chromium, WebKit) et captures
    runs-on: ubuntu-24.04
    container:
      # La même image produit les captures de référence (RUNBOOK) : mêmes navigateurs, mêmes polices.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      CI: 'true'
      E2E_WEBKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npx playwright test
      # The JUnit report (reporter of playwright.config.ts on CI) feeds the recette of the PR (#22).
      - name: Rapport JUnit des tests de bout en bout (recette des PR)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-e2e
          path: reports/junit/
          if-no-files-found: ignore
          retention-days: 30
          # A rerun of the job replaces its report instead of failing on the name.
          overwrite: true
      - name: Rapport et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
