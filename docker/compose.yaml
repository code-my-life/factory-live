# factory-live en service : `docker compose -f docker/compose.yaml up -d --build` depuis WSL.
# Port lié à 127.0.0.1 : ce PC par http://localhost:8446, le tailnet par `tailscale serve --https=8446`.
name: factory-live

services:
  factory-live:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: factory-live:local
    container_name: factory-live
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:8446:8446'
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GITHUB_OWNER: ${GITHUB_OWNER:-code-my-life}
      # Valeurs propres à ce PC (nom tailnet, login Tailscale, dashboard) : dans docker/.env, jamais
      # dans le dépôt (modèle : docker/.env.example). Sans elles, factory-live ne répond qu'à ce PC.
      TAILSCALE_LOGINS: ${TAILSCALE_LOGINS:-}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-http://localhost:8446}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # Le banc de jumeaux de la factory publie ses ports sur ce PC (ADR 0013).
      TWINS_HOST: host.docker.internal
      # Les workflows suivis par leur API générique (ADR 0014) : le studio de video-factory sur ce PC.
      WORKFLOWS: ${WORKFLOWS:-studio=http://host.docker.internal:8448}
      # factory-live lit la factory par le socle (workflow-core, ADR 0015, #72), sur ce PC ; son secret est le
      # fichier workflow-core-secret du dossier des secrets. Rien de la factory n'est monté ici.
      WORKFLOW_CORE_URL: ${WORKFLOW_CORE_URL:-http://host.docker.internal:8447}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - factory-live-data:/data
      # Secrets hors dépôt : workflow-core-secret (le socle), github-token (déblocage, PR, CI).
      - ${HOME}/.config/factory-live:/run/secrets/factory-live:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  factory-live-data:
